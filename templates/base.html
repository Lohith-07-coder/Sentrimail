<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}SentriMail — Support Desk Triage{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/tokens.css">
<link rel="stylesheet" href="/static/css/base.css">
{% block extra_head %}{% endblock %}
</head>
<body>
<header class="header">
  <a href="/" class="brand">
    <div class="brand-mark">S</div>
    <span class="brand-name">SentriMail</span>
  </a>
  <nav class="nav-links">
    {% if user %}
      {% block nav_links %}{% endblock %}
      <div class="user-pill">
        <div class="user-avatar">{{ user.username[0] | upper }}</div>
        <span style="font-weight: 500;">{{ user.username }}</span>
        <span class="role-badge">{{ user.role }}</span>
      </div>
      <a href="/logout" class="logout-btn" title="Sign out of account">Logout</a>
    {% endif %}
  </nav>
</header>

<main class="container">
  {% block content %}{% endblock %}
</main>

<script>
// Clipboard Copy Helper for Complaint Monospace IDs
function copyToClipboard(text, event) {
  if (event) event.stopPropagation();
  navigator.clipboard.writeText(text).then(() => {
    showToast('Copied ID: ' + text);
  }).catch(() => {
    const el = document.createElement('textarea');
    el.value = text;
    document.body.appendChild(el);
    el.select();
    document.execCommand('copy');
    document.body.removeChild(el);
    showToast('Copied ID: ' + text);
  });
}

function showToast(msg) {
  const existing = document.querySelector('.toast-tooltip');
  if (existing) existing.remove();
  const toast = document.createElement('div');
  toast.className = 'toast-tooltip';
  toast.innerText = msg;
  document.body.appendChild(toast);
  setTimeout(() => { if (toast.parentNode) toast.remove(); }, 2000);
}
</script>

{% block scripts %}{% endblock %}
</body>
</html>
