<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SentriMail — Create Account</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/tokens.css">
<link rel="stylesheet" href="/static/css/base.css">
<style>
body {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

.auth-card {
  background-color: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  width: 100%;
  max-width: 420px;
  padding: 32px;
  box-shadow: var(--shadow-lg);
}

.auth-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 24px;
}
</style>
</head>
<body>

<div class="auth-card">
  <a href="/" class="auth-brand">
    <div class="brand-mark">S</div>
    <span class="brand-name">SentriMail</span>
  </a>

  <h1 style="font-size: 20px; margin-bottom: 4px;">Create Account</h1>
  <p class="page-sub" style="margin-bottom: 24px;">Register for a SentriMail account to submit and track support complaints</p>

  {% if error %}<div class="alert alert-error">⚠️ {{ error }}</div>{% endif %}
  {% if success %}<div class="alert alert-success">✅ {{ success }}</div>{% endif %}

  <form method="POST" action="/register">
    <div class="form-group">
      <label class="form-label">Username</label>
      <input type="text" name="username" class="form-input" placeholder="Choose a username" required autofocus>
    </div>

    <div class="form-group">
      <label class="form-label">Email Address</label>
      <input type="email" name="email" class="form-input" placeholder="your.name@company.com" required>
    </div>

    <div class="form-group">
      <label class="form-label">Password</label>
      <input type="password" name="password" class="form-input" placeholder="Min. 6 characters" required>
    </div>

    <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 8px;">
      Create Account →
    </button>
  </form>

  <div style="margin-top: 24px; text-align: center; font-size: 13px; color: var(--text-muted);">
    Already have an account? <a href="/login" style="color: var(--accent); font-weight: 500;">Sign in</a>
  </div>
</div>

</body>
</html>
