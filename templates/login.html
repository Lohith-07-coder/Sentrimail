<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SentriMail — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/tokens.css">
<link rel="stylesheet" href="/static/css/base.css">
<style>
body {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

.auth-card {
  background-color: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  width: 100%;
  max-width: 420px;
  padding: 32px;
  box-shadow: var(--shadow-lg);
}

.auth-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 24px;
}
</style>
</head>
<body>

<div class="auth-card">
  <div class="auth-brand">
    <div class="brand-mark">S</div>
    <span class="brand-name">SentriMail</span>
  </div>

  <h1 style="font-size: 20px; margin-bottom: 4px;">Sign In</h1>
  <p class="page-sub" style="margin-bottom: 24px;">Enter your credentials to access the support desk triage system</p>

  {% if error %}
  <div class="alert alert-error">{{ error }}</div>
  {% endif %}

  <form method="POST" action="/login">
    <div class="form-group">
      <label class="form-label">Username</label>
      <input type="text" name="username" class="form-input" placeholder="Enter username (e.g. admin or alice)" required autofocus>
    </div>

    <div class="form-group">
      <label class="form-label">Password</label>
      <input type="password" name="password" class="form-input" placeholder="••••••••" required>
    </div>

    <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 8px;">
      Sign In to Dashboard
    </button>
  </form>

  <!-- Quick Demo Login Presets -->
  <div style="margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--border);">
    <div class="form-label" style="font-size: 10px; color: var(--text-subtle); margin-bottom: 12px;">Quick Demo Accounts</div>
    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;">
      <button type="button" class="btn btn-outline btn-sm" onclick="fillLogin('admin','admin123')" style="flex-direction:column; align-items:flex-start; padding:8px;">
        <span class="role-badge" style="font-size:9px;">ADMIN</span>
        <span style="font-size:12px; font-weight:600; color:var(--text); margin-top:2px;">admin</span>
      </button>

      <button type="button" class="btn btn-outline btn-sm" onclick="fillLogin('alice','alice123')" style="flex-direction:column; align-items:flex-start; padding:8px;">
        <span class="role-badge badge-user" style="font-size:9px;">USER</span>
        <span style="font-size:12px; font-weight:600; color:var(--text); margin-top:2px;">alice</span>
      </button>

      <button type="button" class="btn btn-outline btn-sm" onclick="fillLogin('bob','bob123')" style="flex-direction:column; align-items:flex-start; padding:8px;">
        <span class="role-badge badge-user" style="font-size:9px;">USER</span>
        <span style="font-size:12px; font-weight:600; color:var(--text); margin-top:2px;">bob</span>
      </button>
    </div>
  </div>

  <div style="margin-top: 20px; text-align: center; font-size: 13px; color: var(--text-muted);">
    Don't have an account? <a href="/register" style="color: var(--accent); font-weight: 500;">Register here</a>
  </div>
</div>

<script>
function fillLogin(u, p) {
  document.querySelector('input[name="username"]').value = u;
  document.querySelector('input[name="password"]').value = p;
}
</script>
</body>
</html>
